<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TSC Monitor">
<meta name="theme-color" content="#080c18">
<link rel="apple-touch-icon" href="https://tscscan.xyz/static/logo.svg">
<title>Tiger Pool TSC Monitor</title>
<style>
:root{--bg:#080c18;--s1:#0f1523;--s2:#161e30;--bd:#1c2840;--bd2:#243050;--blue:#3b82f6;--blue2:#60a5fa;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a78bfa;--orange:#f97316;--text:#e2e8f0;--muted:#3d5070;--muted2:#6b7fa0;--tiger:#f59e0b;--tiger2:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;min-height:100%;overscroll-behavior:none}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(8,12,24,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--bd);padding:13px 18px 11px;display:flex;align-items:center;justify-content:space-between;z-index:99}
.hdr-id{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-title{font-size:16px;font-weight:650;letter-spacing:-.2px}
.hdr-sub{font-size:11px;color:var(--muted2);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.btn-sm{background:var(--s2);border:1px solid var(--bd2);color:var(--muted2);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-sm:active{background:var(--bd)}
.btn-r{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd2);color:var(--tiger2);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-r:active{background:var(--bd)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tsbar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted2);padding:8px 18px 0}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tsbar-r{margin-left:auto}
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.login-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px}
.login-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.login-sub{font-size:14px;color:var(--muted2);text-align:center;line-height:1.5;margin-bottom:32px}
.login-box{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.login-label{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px}
.login-input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;font-family:'SF Mono','Menlo',monospace;outline:none;transition:border-color .15s}
.login-input:focus{border-color:var(--tiger)}
.login-input::placeholder{color:var(--muted);font-size:12px}
.btn-login{width:100%;background:var(--tiger);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-login:active{filter:brightness(.85)}
.login-err{font-size:12px;color:var(--red);text-align:center;display:none;line-height:1.5}
.login-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted2);font-size:14px}
.spinner{width:28px;height:28px;border:2px solid var(--bd2);border-top-color:var(--tiger);border-radius:50%;animation:spin .8s linear infinite}
.price-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px;border-bottom:1px solid var(--bd);width:100%}
.price-usd{font-size:20px;font-weight:720;color:var(--green)}
.price-btc{font-size:11px;color:var(--muted2);margin-top:2px}
.price-change{font-size:11px;font-weight:600;margin-top:2px}
.price-hr{font-size:12px;font-weight:600;color:var(--tiger2);text-align:right}
.price-hr-sub{font-size:10px;color:var(--muted2);margin-top:2px;text-align:right}
.body{flex:1;padding:10px 18px 32px;display:flex;flex-direction:column;gap:9px}
.slabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:4px 1px 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:12px 13px}
.card.hi{border-color:rgba(245,158,11,.35)}
.cl{font-size:10px;color:var(--muted2);margin-bottom:4px}
.cv{font-size:20px;font-weight:720;letter-spacing:-.5px;line-height:1}
.cu{font-size:11px;font-weight:400;color:var(--muted2);margin-left:2px}
.cs{font-size:10px;color:var(--muted2);margin-top:4px}
.tiger{color:var(--tiger2)}.green{color:var(--green)}.yellow{color:var(--yellow)}.purple{color:var(--purple)}.red{color:var(--red)}.blue{color:var(--blue2)}
.chart-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:11px 13px 13px}
.chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.chart-t{font-size:12px;font-weight:600}
.chart-v{font-size:12px;font-weight:600;color:var(--tiger2)}
canvas{display:block}
.scard{background:var(--s1);border:1px solid var(--bd);border-radius:13px;overflow:hidden}
.scard-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);font-size:12px;font-weight:600}
.badge{font-size:10px;color:var(--muted2);background:var(--s2);padding:2px 7px;border-radius:20px;border:1px solid var(--bd)}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd)}
.wrow:last-child{border-bottom:none}
.wdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wname{font-size:12px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whr{font-size:12px;font-weight:650;color:var(--tiger2);white-space:nowrap}
.wtime{font-size:10px;color:var(--muted2);white-space:nowrap;text-align:right;margin-top:1px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.pamt{font-size:13px;font-weight:650;color:var(--green)}
.pmeta{text-align:right;font-size:10px;color:var(--muted2);line-height:1.5}
.kv{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd);font-size:12px}
.kv:last-child{border-bottom:none}
.kk{color:var(--muted2)}.kv-v{font-weight:550}
.stale{background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.25);border-radius:11px;padding:9px 13px;font-size:12px;color:var(--yellow)}
.hint{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 0}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="app">

<!-- Header -->
<div class="hdr" id="hdr" style="display:none">
  <div class="hdr-id">
    <div class="logo">🐯</div>
    <div>
      <div class="hdr-title">Tiger Pool <span style="font-size:10px;background:rgba(245,158,11,.15);color:var(--tiger2);padding:1px 6px;border-radius:10px;border:1px solid rgba(245,158,11,.3);font-weight:600">TSC</span></div>
      <div class="hdr-sub" id="walletLabel">tsc-miner.tiger-pool.com · v1.00</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="btn-sm" onclick="logout()">⇄</button>
    <button class="btn-r" id="rb" onclick="doRefresh()"><span id="ri">↻</span> Refresh</button>
  </div>
</div>

<!-- Login -->
<div class="login" id="loginScreen">
  <div class="login-logo">🐯</div>
  <div class="login-title">Tiger Pool Monitor</div>
  <div class="login-sub">Enter your TSC wallet address (tc1q…) to view your mining stats.</div>
  <div class="login-box">
    <div class="login-label">TSC Wallet Address</div>
    <input class="login-input" id="wi" type="text" placeholder="tc1q…"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" id="loginBtn" onclick="loginLoad()">Load Stats</button>
  </div>
  <div class="login-hint">Stored only on this device — never shared.</div>
</div>

<!-- Loading -->
<div class="loading" id="loadingScreen" style="display:none">
  <div class="spinner"></div>
  <div id="loadingMsg">Fetching stats…</div>
</div>

<!-- Price bar -->
<div id="priceBar" style="display:none"></div>

<!-- Status bar -->
<div id="tsbarWrap" style="display:none">
  <div class="tsbar">
    <div class="dot" id="dot"></div>
    <span id="stxt"></span>
    <span class="tsbar-r" id="tslabel"></span>
  </div>
</div>

<!-- Dashboard -->
<div class="body" id="body" style="display:none"></div>

</div>
<script>
const POOL_API = 'https://tsc-miner.tiger-pool.com/api/v1';
const SCAN_API = 'https://tscscan.xyz/api';
const COIN_UNITS = 1e8; // sats

let WALLET = '';
let current = null;
let refreshTimer = null;
let countdownTimer = null;
let countdownSec = 0;

// ── Helpers ──
function fH(h) {
  if (!h || isNaN(h)) return {v:'0', u:'N/s'};
  if (h >= 1e6) return {v:(h/1e6).toFixed(2), u:'MN/s'};
  if (h >= 1e3) return {v:(h/1e3).toFixed(2), u:'KN/s'};
  return {v:h.toFixed(2), u:'N/s'};
}
function fP(n, d=4) {
  if (n == null || isNaN(n)) return '—';
  return (n / COIN_UNITS).toFixed(d);
}
function ago(iso) {
  if (!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60)    return s + 's ago';
  if (s < 3600)  return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function fD(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}
function wSt(iso) {
  const s = (Date.now() - new Date(iso||0).getTime()) / 1000;
  if (s < 300)  return {c:'var(--green)', g:'0 0 6px var(--green)'};
  if (s < 1800) return {c:'var(--yellow)', g:'none'};
  return {c:'var(--red)', g:'none'};
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmtPrice(p) {
  if (!p) return '—';
  const n = parseFloat(p);
  if (n >= 100) return '$' + n.toFixed(0);
  if (n >= 1)   return '$' + n.toFixed(2);
  if (n >= 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(6);
}

// ── Countdown ──
function startCountdown(sec) {
  clearInterval(countdownTimer);
  countdownSec = sec;
  countdownTimer = setInterval(() => {
    countdownSec--;
    const el = document.getElementById('tslabel');
    if (el && countdownSec > 0 && !el.textContent.includes('Fetching')) {
      const m = Math.floor(countdownSec/60), s = countdownSec % 60;
      el.textContent = m > 0 ? `Next: ${m}m ${s}s` : `Next: ${s}s`;
    }
    if (countdownSec <= 0) clearInterval(countdownTimer);
  }, 1000);
}

// ── Screens ──
function showLogin(err) {
  ['loginScreen'].forEach(id => document.getElementById(id).style.display = 'flex');
  ['loadingScreen','hdr','priceBar','tsbarWrap','body'].forEach(id => document.getElementById(id).style.display = 'none');
  const el = document.getElementById('loginErr');
  if (err) { el.textContent = err; el.style.display = 'block'; }
  else el.style.display = 'none';
  document.getElementById('loginBtn').textContent = 'Load Stats';
  document.getElementById('loginBtn').disabled = false;
}
function showLoading(msg='Fetching stats…') {
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingMsg').textContent = msg;
  ['loginScreen','hdr','priceBar','tsbarWrap','body'].forEach(id => document.getElementById(id).style.display = 'none');
}
function showDash() {
  ['hdr','tsbarWrap','body'].forEach(id => document.getElementById(id).style.display = id==='body'?'flex':'');
  document.getElementById('hdr').style.display = 'flex';
  document.getElementById('priceBar').style.display = 'flex';
  document.getElementById('tsbarWrap').style.display = 'block';
  document.getElementById('body').style.display = 'flex';
  ['loginScreen','loadingScreen'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('walletLabel').textContent = WALLET.slice(0,10)+'…'+WALLET.slice(-6)+' · v1.00';
}

// ── Auth ──
function loginLoad() {
  const w = document.getElementById('wi').value.trim();
  if (!w || w.length < 10) {
    document.getElementById('loginErr').textContent = 'Please enter a valid TSC wallet address.';
    document.getElementById('loginErr').style.display = 'block';
    return;
  }
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('loginBtn').textContent = 'Loading…';
  document.getElementById('loginBtn').disabled = true;
  WALLET = w;
  try { localStorage.setItem('tsc_wallet', w); } catch(e) {}
  fetchAndRender();
}
function logout() {
  try { localStorage.removeItem('tsc_wallet'); localStorage.removeItem('tsc_cache'); } catch(e) {}
  WALLET = ''; current = null;
  document.getElementById('wi').value = '';
  clearTimeout(refreshTimer); clearInterval(countdownTimer);
  showLogin();
}

// ── Fetch ──
async function fetchData(wallet, silent=false) {
  const [minerRes, overviewRes, marketRes, homeRes] = await Promise.all([
    fetch(`${POOL_API}/address/${encodeURIComponent(wallet)}`),
    fetch(`${POOL_API}/overview`),
    fetch(`${SCAN_API}/market-summary`),
    fetch(`${SCAN_API}/home?range=24h`).catch(()=>null)
  ]);

  if (!minerRes.ok) throw new Error(`HTTP ${minerRes.status}`);
  const [miner, overview, market, home] = await Promise.all([
    minerRes.json(),
    overviewRes.json(),
    marketRes.json(),
    homeRes ? homeRes.json() : null
  ]);

  const w = miner.wallet || {};
  if (!w.Wallet) throw new Error('Wallet not found on Tiger Pool.');

  const pool = overview.pool || {};
  const net  = overview.network || {};
  const metrics = home?.metrics || {};

  // Build hashrate chart from address hashrate endpoint
  let hrChart = [];
  try {
    const hrRes = await fetch(`${POOL_API}/address/${encodeURIComponent(wallet)}/hashrate?period=24h`);
    if (hrRes.ok) {
      const hrData = await hrRes.json();
      hrChart = (hrData.points || []).map(p => [new Date(p.at).getTime(), p.hashrate]);
    }
  } catch(e) {}

  // Sum worker hashrates for averages
  const workers = miner.workers || [];
  const sumHr = workers.reduce((a,w) => a + (w.Hashrate||0), 0);

  // Build trend from worker HashrateTrend
  const trendMap = {};
  workers.forEach(w => {
    (w.HashrateTrend||[]).forEach(pt => {
      trendMap[pt.at] = (trendMap[pt.at]||0) + pt.hashrate;
    });
  });
  const trend = Object.entries(trendMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([at,hr])=>[new Date(at).getTime(),hr]);

  return {
    fetched: Math.floor(Date.now()/1000),
    wallet,
    stat: {
      hr:           sumHr,
      balance:      parseInt(w.BalanceSats||0),
      immature:     parseInt(w.ImmatureSats||0),
      paid:         parseInt(w.PaidSats||0),
      paid24h:      parseInt(w.Paid24hSats||0),
      earnings24h:  parseInt(w.ActualEarnings24hSats||0),
      accepted:     parseInt(w.AcceptedShares||0),
      rejected:     parseInt(w.RejectedShares||0),
      lastShare:    w.LastShareAt||null,
      attention:    w.AttentionCode||'',
    },
    pool: {
      hashrate:       pool.PoolHashrate||0,
      workers:        pool.Workers||0,
      onlineWorkers:  pool.OnlineWorkers||0,
      totalBlocks:    pool.TotalBlocks||0,
      pendingBlocks:  pool.PendingBlocks||0,
      immatureBlocks: pool.ImmatureBlocks||0,
      orphanedBlocks: pool.OrphanedBlocks||0,
      fee:            3,
      netHashrate:    net.networkHashPS||0,
      netHashrate24h: net.networkHashPS24h||0,
      height:         net.height||0,
      blockRewardSats: metrics.current_block_reward_sats||5559840000,
      blockTime50:    metrics.average_block_seconds_50||600,
    },
    market: {
      price:          market.price_usdt||'—',
      change24h:      market.price_change_percent_24h||'',
      marketCap:      market.circulating_market_cap_usdt||'—',
      source:         market.source||'',
    },
    workers: workers.map(w => ({
      id:         w.WorkerID||'',
      hashrate:   w.Hashrate||0,
      lastShare:  w.LastShareAt||null,
      trend:      (w.HashrateTrend||[]).map(p=>[new Date(p.at).getTime(),p.hashrate]),
    })),
    payments: (miner.payments||[]),
    hrChart: trend.length > 0 ? trend : hrChart,
  };
}

async function fetchAndRender(silent=false) {
  if (!silent) showLoading('Fetching Tiger Pool stats…');
  try {
    const d = await fetchData(WALLET, silent);
    current = d;
    try { localStorage.setItem('tsc_cache', JSON.stringify(d)); } catch(e) {}
    render(d);
    if (!silent) showDash();
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => doRefresh(), 60000);
    startCountdown(60);
  } catch(e) {
    if (!silent) {
      try {
        const c = JSON.parse(localStorage.getItem('tsc_cache')||'null');
        if (c && c.wallet===WALLET) { current=c; render(c); showDash(); return; }
      } catch(e2) {}
      showLogin('⚠️ ' + e.message);
    } else {
      if (current) render(current);
      refreshTimer = setTimeout(() => doRefresh(), 60000);
      startCountdown(60);
    }
  }
}

async function doRefresh() {
  if (!WALLET) return;
  const ic = document.getElementById('ri');
  const rb = document.getElementById('rb');
  ic.classList.add('spin');
  if (rb) rb.disabled = true;
  clearInterval(countdownTimer);
  clearTimeout(refreshTimer);
  document.getElementById('tslabel').textContent = 'Fetching…';
  try {
    await fetchAndRender(true);
    showDash();
  } catch(e) {}
  finally {
    if (rb) rb.disabled = false;
    ic.classList.remove('spin');
  }
}

// ── Render ──
function render(d) {
  const st = d.stat, pool = d.pool, mkt = d.market;
  const now = new Date(d.fetched*1000).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
  const pUSD = parseFloat(mkt.price) || 0;
  const isOnline = st.lastShare && (Date.now() - new Date(st.lastShare).getTime()) < 600000;

  // Status dot
  const dot = document.getElementById('dot');
  dot.style.background = isOnline ? 'var(--green)' : 'var(--yellow)';
  dot.style.boxShadow = isOnline ? '0 0 6px var(--green)' : 'none';
  document.getElementById('stxt').textContent = isOnline ? 'Mining active' : 'No recent shares';

  // Price bar
  const hrF = fH(st.hr);
  const changeColor = mkt.change24h.startsWith('+') ? 'var(--green)' : 'var(--red)';
  document.getElementById('priceBar').innerHTML = `
    <div style="padding:4px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);width:100%">
      <div>
        <div class="price-usd">${fmtPrice(mkt.price)}</div>
        <div class="price-change" style="color:${changeColor}">${mkt.change24h} 24h</div>
        <div class="price-btc">via ${mkt.source}</div>
      </div>
      <div style="text-align:right">
        <div class="price-hr">${hrF.v} ${hrF.u}</div>
        <div class="price-hr-sub">Your hashrate</div>
      </div>
    </div>`;

  const age = Math.floor(Date.now()/1000) - d.fetched;
  let html = '';
  if (age > 300) html += `<div class="stale">⚠️ Data is ${Math.floor(age/60)}m old — tap Refresh</div>`;

  // Chart
  const nonZero = d.hrChart.filter(p => p[1] > 0);
  const chartPts = d.hrChart.map(p => p[1]);
  const curHrF = fH(st.hr);
  html += `<div class="chart-wrap">
    <div class="chart-top">
      <span class="chart-t">Hashrate (24h)</span>
      <span class="chart-v">${curHrF.v} <span style="font-size:10px;color:var(--muted2)">${curHrF.u}</span></span>
    </div>
    <canvas id="hc" height="68" style="width:100%;height:68px"></canvas>
  </div>`;

  // Stats
  const totalShares = st.accepted + st.rejected;
  const acc = totalShares > 0 ? ((st.accepted/totalShares)*100).toFixed(1) : '100.0';
  const accCls = parseFloat(acc) > 98 ? 'green' : parseFloat(acc) > 94 ? 'yellow' : 'red';
  const immatureUSD = (parseFloat(fP(st.immature,4))*pUSD).toFixed(3);
  const earnings24hUSD = (parseFloat(fP(st.earnings24h,6))*pUSD).toFixed(3);

  html += `<div class="slabel">Your Stats</div>
  <div class="g2">
    <div class="card hi">
      <div class="cl">Current Hashrate</div>
      <div class="cv tiger">${curHrF.v}<span class="cu">${curHrF.u}</span></div>
      <div class="cs">Last: ${ago(st.lastShare)}</div>
    </div>
    <div class="card">
      <div class="cl">Immature Balance</div>
      <div class="cv green">${fP(st.immature,4)}<span class="cu">TSC</span></div>
      <div class="cs">≈ $${immatureUSD}</div>
    </div>
    <div class="card">
      <div class="cl">Actual Earned 24h</div>
      <div class="cv purple">${fP(st.earnings24h,6)}<span class="cu">TSC</span></div>
      <div class="cs">≈ $${earnings24hUSD}</div>
    </div>
    <div class="card">
      <div class="cl">Total Paid</div>
      <div class="cv">${fP(st.paid,4)}<span class="cu">TSC</span></div>
      <div class="cs">≈ $${(parseFloat(fP(st.paid,4))*pUSD).toFixed(2)}</div>
    </div>
    <div class="card">
      <div class="cl">Acceptance Rate</div>
      <div class="cv ${accCls}">${acc}<span class="cu">%</span></div>
      <div class="cs">${st.accepted} good · ${st.rejected} rej</div>
    </div>
    <div class="card">
      <div class="cl">Last Share</div>
      <div class="cv" style="font-size:16px">${ago(st.lastShare)}</div>
      <div class="cs">${fD(st.lastShare)}</div>
    </div>
  </div>`;

  // Estimated daily
  const bpd = 86400 / (pool.blockTime50 || 600);
  const estDay = pool.netHashrate > 0 ? (st.hr / pool.netHashrate) * bpd * (pool.blockRewardSats / COIN_UNITS) : 0;
  const estUSD = (estDay * pUSD).toFixed(3);
  const estMonth = (estDay * 30 * pUSD).toFixed(2);
  html += `<div class="card" style="border-color:rgba(34,197,94,.25)">
    <div class="cl">Estimated Daily Earnings</div>
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <div class="cv green">${estDay.toFixed(6)}<span class="cu">TSC</span></div>
      <div style="font-size:15px;font-weight:600;color:var(--green)">≈ $${estUSD}</div>
    </div>
    <div class="cs">~$${estMonth}/mo · based on current network hashrate</div>
  </div>`;

  // Workers
  if (d.workers.length > 0) {
    const onlineW = d.workers.filter(w => w.lastShare && (Date.now()-new Date(w.lastShare).getTime())<600000).length;
    html += `<div class="slabel">Workers (${d.workers.length})</div>
    <div class="scard"><div class="scard-hdr">Rigs <span class="badge">${onlineW}/${d.workers.length} online</span></div>`;
    d.workers.forEach(w => {
      const ws = wSt(w.lastShare);
      const whr = fH(w.hashrate);
      // Shorten worker ID (token prefix)
      const wname = w.id.replace('tscp_','').slice(0,12)+'…';
      html += `<div class="wrow">
        <div class="wdot" style="background:${ws.c};box-shadow:${ws.g}"></div>
        <div style="flex:1;min-width:0">
          <div class="wname">${esc(wname)}</div>
          <div style="font-size:9px;color:var(--muted)">${fD(w.lastShare)}</div>
        </div>
        <div style="text-align:right">
          <div class="whr">${whr.v} <span style="font-size:9px;color:var(--muted2)">${whr.u}</span></div>
          <div class="wtime">${ago(w.lastShare)}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Payments
  if (d.payments && d.payments.length > 0) {
    html += `<div class="slabel">Payments</div><div class="scard"><div class="scard-hdr">Recent Payouts</div>`;
    d.payments.slice(0,8).forEach(p => {
      const amt = parseInt(p.AmountSats||p.amount_sats||0);
      html += `<div class="prow">
        <div>
          <div class="pamt">+${fP(amt,4)} TSC</div>
          <div style="font-size:10px;color:var(--tiger2);font-family:'SF Mono','Menlo',monospace">${(p.TxHash||p.txid||'').slice(0,14)}…</div>
        </div>
        <div class="pmeta">${fD(p.PaidAt||p.paid_at)}<br>≈ $${(parseFloat(fP(amt,4))*pUSD).toFixed(3)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Network stats from tscscan
  const netHrF = fH(pool.netHashrate);
  const netHr24F = fH(pool.netHashrate24h);
  const poolHrF = fH(pool.hashrate);
  html += `<div class="slabel">Network & Pool (TSCScan)</div>
  <div class="scard">
    <div class="kv"><span class="kk">TSC Price</span><span class="kv-v green">${fmtPrice(mkt.price)} <span style="color:${changeColor};font-size:10px">${mkt.change24h}</span></span></div>
    <div class="kv"><span class="kk">Network Rate</span><span class="kv-v tiger">${netHrF.v} ${netHrF.u}</span></div>
    <div class="kv"><span class="kk">Network Rate 24h</span><span class="kv-v">${netHr24F.v} ${netHr24F.u}</span></div>
    <div class="kv"><span class="kk">Pool Hashrate</span><span class="kv-v blue">${poolHrF.v} ${poolHrF.u}</span></div>
    <div class="kv"><span class="kk">Pool Workers</span><span class="kv-v">${pool.onlineWorkers.toLocaleString()} online / ${pool.workers.toLocaleString()} total</span></div>
    <div class="kv"><span class="kk">Chain Height</span><span class="kv-v">${pool.height.toLocaleString()}</span></div>
    <div class="kv"><span class="kk">Block Reward</span><span class="kv-v">${fP(pool.blockRewardSats,2)} TSC</span></div>
    <div class="kv"><span class="kk">Avg Block Time (50)</span><span class="kv-v">${pool.blockTime50.toFixed(0)}s</span></div>
    <div class="kv"><span class="kk">Pool Blocks Found</span><span class="kv-v">${pool.totalBlocks.toLocaleString()} (${pool.orphanedBlocks} orphaned)</span></div>
    <div class="kv"><span class="kk">Pool Fee</span><span class="kv-v" style="color:var(--yellow)">${pool.fee}%</span></div>
  </div>
  <div class="hint">Updated ${now} · tap Refresh for latest</div>`;

  document.getElementById('body').innerHTML = html;
  requestAnimationFrame(() => requestAnimationFrame(() => drawChart('hc', chartPts)));
}

function drawChart(id, pts) {
  const c = document.getElementById(id);
  if (!c || pts.length < 2) return;
  const dpr = window.devicePixelRatio||1, W = c.parentElement.clientWidth-26, H = 68;
  c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const min = Math.min(...pts)*.92, max = Math.max(...pts)*1.05||1, n = pts.length;
  const xO = i => i*(W/(n-1)), yO = v => H-((v-min)/(max-min))*(H-8)-4;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(245,158,11,.28)'); g.addColorStop(1,'rgba(245,158,11,.01)');
  ctx.beginPath(); ctx.moveTo(xO(0),yO(pts[0]));
  for(let i=1;i<n;i++){const cx=(xO(i-1)+xO(i))/2;ctx.bezierCurveTo(cx,yO(pts[i-1]),cx,yO(pts[i]),xO(i),yO(pts[i]));}
  ctx.lineTo(xO(n-1),H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(xO(0),yO(pts[0]));
  for(let i=1;i<n;i++){const cx=(xO(i-1)+xO(i))/2;ctx.bezierCurveTo(cx,yO(pts[i-1]),cx,yO(pts[i]),xO(i),yO(pts[i]));}
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.8;ctx.stroke();
  ctx.beginPath();ctx.arc(xO(n-1),yO(pts[n-1]),3,0,Math.PI*2);ctx.fillStyle='#fbbf24';ctx.fill();
}

document.getElementById('wi').addEventListener('keydown', e => { if(e.key==='Enter') loginLoad(); });

// Boot
try {
  const saved = localStorage.getItem('tsc_wallet');
  if (saved) {
    WALLET = saved;
    document.getElementById('wi').value = saved;
    const cached = localStorage.getItem('tsc_cache');
    if (cached) {
      const c = JSON.parse(cached);
      if (c.wallet === WALLET) { current=c; render(c); showDash(); fetchAndRender(true); }
      else fetchAndRender();
    } else fetchAndRender();
  } else showLogin();
} catch(e) { showLogin(); }
</script>
